name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLANG_FORMAT_VERSION: "22.1.3"

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned clang-format
        run: python -m pip install "clang-format==$env:CLANG_FORMAT_VERSION"

      - name: Check formatting
        run: python tools/check_format.py

      - name: Configure (Debug)
        run: cmake --preset windows-debug

      - name: Build (Debug)
        run: cmake --build --preset windows-debug

      - name: Test (Debug)
        run: ctest --preset windows-debug

      - name: Configure (Release)
        run: cmake --preset windows-release

      - name: Build (Release)
        run: cmake --build --preset windows-release

      - name: Test (Release)
        run: ctest --preset windows-release

  linux:
    name: Linux (GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-tidy
          python -m pip install "clang-format==${CLANG_FORMAT_VERSION}"

      - name: Check formatting
        run: python tools/check_format.py

      - name: Configure (Debug)
        run: cmake --preset linux-debug

      - name: Build (Debug)
        run: cmake --build --preset linux-debug

      - name: Test (Debug)
        run: ctest --preset linux-debug

      - name: Configure (ASan + UBSan)
        run: cmake --preset linux-asan

      - name: Build (ASan + UBSan)
        run: cmake --build --preset linux-asan

      - name: Test (ASan + UBSan)
        run: ctest --preset linux-asan

      - name: Configure (Release)
        run: cmake --preset linux-release

      - name: Build (Release)
        run: cmake --build --preset linux-release

      - name: Test (Release)
        run: ctest --preset linux-release

      # Advisory until it has run green on the project's CI a few times. The
      # deterministic gates above (warnings-as-errors, tests, format, ASan)
      # are what block a change today.
      - name: Static analysis (advisory)
        continue-on-error: true
        run: |
          clang-tidy -p build/linux-debug --warnings-as-errors=* \
            engine/core/src/log.cpp \
            engine/core/src/memory.cpp \
            engine/core/src/time.cpp
